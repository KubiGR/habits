# Komodo stack for Habits: Postgres and the app. Komodo clones this repo on the server and runs
# this file from deploy/ with "run build" on, so the image is built from the commit being deployed.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habits
      POSTGRES_DB: habits
      # Postgres is never published, only reachable on this stack's own network. To use a different
      # password, set POSTGRES_PASSWORD in the stack's environment before the first deploy: Postgres
      # reads it only when it creates the database. Keep it URL-safe, it goes into DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habits}
    volumes:
      - habits-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habits']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [habits]

  app:
    build:
      # Relative to this file: the repository root.
      context: ..
    image: habits:latest
    # Never try to pull habits:latest from a registry; it only exists here.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://habits:${POSTGRES_PASSWORD:-habits}@db:5432/habits
      # Manages account access in the People tab and owns habits created before accounts existed.
      # Set OWNER_EMAIL in the stack's environment (Komodo), so it isn't in the repo.
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in the stack environment}
      # habits.dranidis.com is behind Cloudflare Access, which signs every request; the server
      # checks the signature against these, so it knows who is asking. Neither is secret.
      ACCESS_TEAM_DOMAIN: dranidis.cloudflareaccess.com
      ACCESS_AUD: ea98eb0a0f37e5fa8c2d9179693b4fc1c773dcabfb9aaae011096232ffbc6c21
    # Only on the server itself, where the Cloudflare tunnel picks it up. A request that skipped
    # Access would be refused anyway (no signed login), so this just keeps the LAN tidy.
    ports:
      - '127.0.0.1:${APP_PORT:-3090}:3000'
    networks: [habits]

volumes:
  habits-pgdata:

networks:
  habits:
